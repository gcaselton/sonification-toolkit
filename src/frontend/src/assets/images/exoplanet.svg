<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Exoplanet Transit</title>
  <desc id="desc">
    A planet passing in front of a star during an exoplanet transit.
  </desc>

  <!-- Star -->
  <circle
    class="star"
    cx="100"
    cy="90"
    r="48"
    fill="white"
  />

  <!-- Planet -->
  <circle
    class="planet"
    cx="45"
    cy="90"
    r="12"
    fill="black"
    stroke="currentColor"
    stroke-width="3"
  />

  <!-- Planet's transit path -->
  <!-- <path
    class="orbit"
    d="M 20,90 C 60,90 140,90 180,90"
    fill="none"
    stroke="black"
    opacity="0.5"
    stroke-width="1"
    stroke-dasharray="5 5"
  /> -->
</svg>